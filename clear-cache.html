<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - ER Diagram Modeler</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            margin-top: 0;
            color: #8a50ff;
        }

        button {
            background: linear-gradient(135deg, #8a50ff, #6a3fd4);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .success {
            background: #10b981;
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Clear Cached Settings</h1>
        <p>Click the button below to clear old cached model settings.</p>
        <button onclick="clearCache()">Clear Cache & Reload</button>
        <div class="success" id="success">✓ Cache cleared! Redirecting...</div>
    </div>

    <script>
        function clearCache() {
            // Clear the cached config
            localStorage.removeItem('er_diagram_config');

            // Show success message
            document.getElementById('success').style.display = 'block';

            // Redirect to main app after 1 second
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }
    </script>
</body>

</html>
